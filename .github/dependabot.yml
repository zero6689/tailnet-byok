# Dependency updates.
#
# Grouped deliberately: this project has few dependencies and would rather
# review three meaningful pull requests a month than thirty trivial ones that
# train a maintainer to click merge without reading.
#
# Security-relevant ecosystems are watched closely, because the whole point of
# this app is that a key can be trusted to it:
#   * `gomod` covers tailscale.com/tsnet, which is the component that actually
#     handles the credential and the tunnel;
#   * `gradle` covers the AndroidX and OkHttp surface;
#   * `github-actions` covers the workflows, which hold the signing secrets.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /tailnet
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: 'deps(go)'
    groups:
      go-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    commit-message:
      prefix: 'deps(gradle)'
    groups:
      androidx:
        patterns: ['androidx.*']
        update-types: [minor, patch]
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: 'deps(ci)'
    groups:
      actions:
        patterns: ['*']
