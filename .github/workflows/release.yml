name: Release

# Builds a signed release APK (with the embedded node) on a version tag and
# attaches it to a GitHub release.
#
# Signing material comes from repository secrets and is never written to a file
# in the workspace that outlives the step. The keystore is materialised from a
# base64 secret into a path outside the checkout, used, and removed.
#
# Required secrets:
#   KEYSTORE_BASE64     base64 of the .jks file
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
#
# See .env.example for how to produce the base64 value without leaking it.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check that signing secrets are configured
        run: |
          set -euo pipefail
          # Fail before spending ten minutes on a native build that cannot be
          # signed. An unsigned release APK is useless to users, so this is a
          # hard error rather than a warning.
          missing=""
          [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "${{ secrets.KEY_ALIAS }}" ]         || missing="$missing KEY_ALIAS"
          [ -n "${{ secrets.KEY_PASSWORD }}" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing signing secrets:$missing"
            exit 1
          fi
          echo "ok: signing secrets present"

      - name: Read the Go version the module requires
        id: gover
        run: |
          set -euo pipefail
          echo "version=$(grep -E '^go [0-9]+\.[0-9]+' tailnet/go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-dependency-path: tailnet/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=26.3.11579264
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # No `yes | sdkmanager` under `set -o pipefail`: `yes` dies of SIGPIPE
          # when sdkmanager exits, and the pipeline fails after a successful
          # install. Accept licences best-effort, then install without a pipe.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_PATH"

      - name: Build the native bridge
        env:
          # The script probes for a reachable module proxy when GOPROXY is unset;
          # on a runner the official one works, so it is left to the script (a fork
          # behind a restrictive network can set the `GOPROXY` repository variable
          # and the script will respect it).
          GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
        # The build is delegated, not spelled out here. This step used to have its
        # own copy — `go install …@latest` plus a hand-written `gomobile bind` run
        # from the repository root — and it had never once succeeded: gomobile
        # resolves "the current module" from the working directory, so binding
        # `./tailnet` from the root fails with "requires golang.org/x/mobile in the
        # current module, but it is not in the module dependency graph" (the
        # message names the dependency; the problem is the directory). It also
        # installed gomobile at `@latest`, which breaks the rule that gomobile and
        # gobind must come from the pinned x/mobile revision.
        #
        # `scripts/build-bridge.mjs` is the recipe: it pins the revision, refuses
        # to build if `go mod tidy` moves the pin, binds from inside the module,
        # injects the version stamps, and passes `GOFLAGS=-trimpath` so the
        # shipped library does not record this machine's source paths.
        run: node scripts/build-bridge.mjs

      - name: Materialise the signing keystore
        run: |
          set -euo pipefail
          # Written outside the checkout on purpose: a signing key inside the
          # workspace is a signing key that can be picked up by a later
          # upload-artifact step.
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # One ABI, and no R8, and both are deliberate:
        #
        #   * `arm64-v8a` only: a four-ABI release is ~164 MiB, and the download
        #     button on `site/provisioning.html` is aimed at a phone. The page says
        #     arm64, so the asset is arm64.
        #   * `-PnoMinify=true`: see docs/RELEASING.md. The keep rules look
        #     complete, but the only builds this project has ever run are ones it
        #     could install, and the first public artefact is not the place to bet
        #     on them. It costs about 10 MB.
        run: ./gradlew --no-daemon assembleRelease -PwithTsnet=true -PabiFilters=arm64-v8a -PnoMinify=true

      - name: Rename the asset to the published name
        # The download link on the provisioning page is
        # `/releases/latest/download/tailnet-byok-arm64.apk`, so the name has to be
        # the same for every release. Renaming here rather than configuring Gradle
        # keeps the build's own output name alone.
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo "::error::no release APK produced"; exit 1; }
          mv "$apk" app/build/outputs/apk/release/tailnet-byok-arm64.apk

      - name: Refuse to publish a build that names this machine
        # The native library is a Go binary, and Go records the paths it was
        # compiled from. On a runner those paths name nobody; on a workstation they
        # name a user profile. This is the gate, not a habit: see
        # scripts/scan-apk-paths.mjs and docs/RELEASING.md.
        run: node scripts/scan-apk-paths.mjs app/build/outputs/apk/release/tailnet-byok-arm64.apk

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/tailnet-byok-arm64.apk
          [ -f "$apk" ] || { echo "::error::no release APK produced"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          echo "signed: $apk"

      - name: Write the release notes and their record
        # The record is what stands in for the AAR, which is never committed: it is
        # the answer to "what is actually inside this binary". docs/RELEASING.md
        # lists the fields; this step is where they come from.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/tailnet-byok-arm64.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/{print $2; exit}')
          AAR_SHA=$(sha256sum app/libs/tailnet.aar | cut -d' ' -f1)
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          MOBILE=$(node scripts/build-bridge.mjs --check 2>/dev/null | grep -oE 'v0\.0\.0-[0-9]{14}-[0-9a-f]{12}' | head -n1 || true)
          TS=$(cd tailnet && go list -m tailscale.com | awk '{print $2}')
          {
            echo "## Install"
            echo
            echo "Download \`tailnet-byok-arm64.apk\` below (Android 8.0+, arm64) and install it. Android"
            echo "warns about installing from outside the Play Store; that warning is correct, because"
            echo "this app is not distributed through it."
            echo
            echo "Then open the app: a fresh install shows how to connect it. The short version is that"
            echo "somebody who runs a DSH server hands over a target — its own page can draw the link and"
            echo "its QR code — and you sign in against that server. Nothing here talks to a server of ours."
            echo
            echo "## What is in this build"
            echo
            echo "This build includes the embedded Tailscale node. Your auth key is entered in the app"
            echo "and stored encrypted by the Android Keystore; it is not present in this APK in any form."
            echo "See [docs/SECURITY-MODEL.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/SECURITY-MODEL.md)"
            echo "before trusting it with a key that can join a machine to your tailnet."
            echo
            echo "## Verify what you downloaded"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Go toolchain | \`$(go version | awk '{print $3, $4}')\` |"
            echo "| golang.org/x/mobile | \`${MOBILE:-see the build log}\` |"
            echo "| tailscale.com | \`$TS\` |"
            echo "| AAR SHA-256 | \`$AAR_SHA\` |"
            echo "| APK SHA-256 | \`$APK_SHA\` |"
            echo "| Signing certificate SHA-256 | \`$CERT\` |"
            echo "| Third-party notices | [THIRD-PARTY-NOTICES.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/THIRD-PARTY-NOTICES.md) |"
            echo
            echo "\`\`\`bash"
            echo "sha256sum tailnet-byok-arm64.apk"
            echo "apksigner verify --print-certs tailnet-byok-arm64.apk"
            echo "\`\`\`"
            echo
            echo "The certificate fingerprint is how you check that the next release will install over"
            echo "this one: Android refuses an update signed by a different key."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Remove the signing keystore
        if: always()
        run: rm -f "${KEYSTORE_FILE:-/nonexistent}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/tailnet-byok-arm64.apk
          body_path: ${{ runner.temp }}/release-notes.md
