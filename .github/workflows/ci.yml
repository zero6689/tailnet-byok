name: CI

# Runs on every push and pull request. Four jobs, deliberately separate, so a
# failure tells you which kind of problem you have:
#
#   guardrails  — policy violations (a bare Log call, a committed credential)
#   licences    — the third-party notices still match the dependency graph
#   test        — unit tests and lint, no native toolchain needed
#   assemble    — does a debug APK actually build
#
# The build that includes the embedded node is NOT here. It needs Go, gomobile
# and the NDK, which is minutes of setup, and it lives in tailnet-bridge.yml
# where it is triggered only when the Go bridge or this workflow changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes to the repository, so the
# token does not need to be able to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  # ---------------------------------------------------------------------------
  # Policy guardrails.
  #
  # These are the checks that keep the security claims in README.md and
  # SECURITY.md true over time. A claim in a document decays; a check in CI does
  # not.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No bare android.util.Log outside SafeLog
        run: |
          set -euo pipefail
          # SafeLog.kt is the one file allowed to touch android.util.Log: it is
          # the redacting wrapper. Anywhere else, a Log call is a credential
          # waiting to leak.
          hits=$(grep -rn 'android\.util\.Log' --include='*.kt' app/src \
                 | grep -v 'core/log/SafeLog.kt' || true)
          if [ -n "$hits" ]; then
            echo "::error::android.util.Log used outside SafeLog.kt — route it through SafeLog so it is redacted."
            echo "$hits"
            exit 1
          fi
          echo "ok: all logging goes through SafeLog"

      - name: No credential-shaped string in tracked files
        run: |
          set -euo pipefail
          # Match real credential shapes, and let fixtures through only when they
          # say so.
          #
          # The first version of this check was close to useless, and the way it
          # failed is worth keeping written down. It filtered the hits with
          #
          #   grep -viE 'EXAMPLE|PLACEHOLDER|dummy|fake|redact|test|\.md:'
          #
          # `git grep -n` prints `path:line:text`, so `test` matched the *path*:
          # every file under a `test/` directory was skipped — which is precisely
          # where somebody pastes a key while debugging — and `\.md:` skipped every
          # markdown file, the other place that happens. Measured on the tree it
          # was written for, it discarded all seven credential-shaped strings in
          # the repository, and would have discarded a real key just as quietly.
          #
          # So: no path-based exclusions, and no broad word like `test`. A line is
          # allowed only if it carries an explicit `not-a-secret` marker or an
          # obvious placeholder word. The default is "this is a secret".
          pattern='(tskey-(auth|api)-[A-Za-z0-9]{8,}|hskey-auth-[A-Za-z0-9]{8,}|tsclientsecret-[A-Za-z0-9]{8,})'
          hits=$(git grep -nIE "$pattern" -- . \
                 | grep -viE 'not-a-secret|EXAMPLE|PLACEHOLDER' || true)
          if [ -n "$hits" ]; then
            echo "::error::a credential-shaped string is committed. Rotate it immediately, then remove it and rewrite history."
            echo "::error::If it is a fixture, mark the line with a comment containing not-a-secret."
            echo "$hits"
            exit 1
          fi
          echo "ok: no credential-shaped strings in tracked files"

      - name: No build-machine paths in tracked files
        run: |
          set -euo pipefail
          # A path from somebody's machine is not a credential, but it is not
          # something a public repository should carry either: it names a user, a
          # drive layout, or a company's directory structure, and it travels on into
          # every build artefact (`-trimpath` keeps it out of the compiled library;
          # this keeps it out of the repository).
          #
          # Fails rather than warns. Unlike a tailnet address, there is no version
          # of this that a document legitimately needs: an example is written with a
          # placeholder, and the placeholders are the exemption list below.
          hits=$(git grep -nIE '([A-Za-z]:\\Users\\[^\\ ]+)|(/home/[a-z0-9._-]+)|(/Users/[a-z0-9._-]+)' -- . \
                 | grep -viE 'runner|example|\\Users\\(you|user|me|name|username)|/(home|Users)/(you|user|me|name)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::a build-machine path is committed. Replace the user name with a placeholder."
            echo "$hits"
            exit 1
          fi
          echo "ok: no build-machine paths in tracked files"

      - name: No private network addresses in tracked files
        run: |
          set -euo pipefail
          # A tailnet address is not a secret, but a committed one leaks the
          # maintainer's own topology into a public repository -- and this check
          # was already the reason one such address was found, so it scans
          # documentation too. It used to exclude `*.md`, which is where a pasted
          # log most often ends up.
          #
          # Exempt: the documented example block (100.101.102.x, which the app's
          # placeholder and the test fixtures use), the network address and DNS
          # address of the tailnet range itself, and its top boundary -- that last
          # one is a range test, so it is a fixture rather than a device.
          hits=$(git grep -nIE '\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' \
                 -- . \
                 | grep -vE '100\.(64\.0\.(0|1)|100\.100\.100|101\.102\.|127\.255\.255)' || true)
          if [ -n "$hits" ]; then
            echo "::warning::a specific tailnet address appears in a tracked file — use 100.101.102.103 or 100.64.0.1 instead."
            echo "$hits"
          fi
          echo "ok: no unexpected tailnet literals"

      - name: No pre-filled target in committed properties
        run: |
          set -euo pipefail
          # The mechanism that lets a private build pre-fill a target
          # (-PdefaultTarget=…) is upstream on purpose; the value is not. A
          # gradle.properties entry is exactly how one would leak in — it would be
          # committed, it would apply to everyone's build, and it would name a real
          # machine. The build-property form in documentation (`-PdefaultTarget=…`)
          # is not what this looks for: only a bare assignment at the start of a
          # properties line.
          hits=$(git grep -nIE '^[[:space:]]*default(Target|Mode|UpdateUrl|ProvisioningUrl)[[:space:]]*=' -- '*.properties' || true)
          if [ -n "$hits" ]; then
            echo "::error::a default target/mode/update URL is committed in a properties file."
            echo "::error::Pass it on the command line (-PdefaultTarget=…) or in an untracked file instead."
            echo "$hits"
            exit 1
          fi
          echo "ok: no committed default target"

      - name: The vendored QR bundle still matches the vendored encoder
        run: |
          set -euo pipefail
          # site/qr.js is generated by scripts/vendor-qr.mjs, and a generated file
          # that nobody regenerates rots. This rebuilds it in memory, compares bytes,
          # and re-checks its output against the upstream encoder matrix by matrix —
          # a bad flattening would otherwise ship as a QR code that no scanner reads.
          node scripts/vendor-qr.mjs --check

  # ---------------------------------------------------------------------------
  # Third-party notices.
  #
  # Separate from `guardrails` on purpose: this one needs a Go toolchain, and the
  # static checks above are supposed to stay instant and dependency-free.
  # ---------------------------------------------------------------------------
  licences:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `scripts/third-party-licenses.mjs` sets GOTOOLCHAIN=local, so whatever
      # runs it has to be the toolchain the module asks for.
      - name: Read the Go version the module requires
        id: gover
        run: |
          set -euo pipefail
          version=$(grep -E '^go [0-9]+\.[0-9]+' tailnet/go.mod | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-dependency-path: tailnet/go.sum

      - name: Regenerate and compare
        run: |
          set -euo pipefail
          # BSD-3-Clause and Apache-2.0 attach conditions to *binary* distribution,
          # and these files are how those conditions are met. A generated file that
          # is never regenerated rots quietly, so this is a check rather than a
          # paragraph in a document asking people to remember.
          ( cd tailnet && go mod download )
          node scripts/third-party-licenses.mjs
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md licenses/; then
            echo "::error::THIRD-PARTY-NOTICES.md or licenses/ no longer matches the dependency graph."
            git diff --stat -- THIRD-PARTY-NOTICES.md licenses/
            echo "Run 'node scripts/third-party-licenses.mjs' and commit the result."
            exit 1
          fi
          echo "ok: third-party notices match the dependency graph"

      # The same texts also travel *inside* the APK, because the build strips
      # META-INF/NOTICE from it: `app/src/main/assets/licenses/` is what the in-app
      # licence screen reads. Generated from the notices above, so it can rot in
      # exactly the same way, and is checked in exactly the same way. No Go needed
      # for this one — it reads the file the previous step just verified.
      - name: Check the in-app licence assets
        run: |
          set -euo pipefail
          node scripts/generate-license-screen.mjs --check

  # ---------------------------------------------------------------------------
  # Unit tests and lint. No Go, no NDK: the default build is pure Kotlin.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Does it actually build? Tests passing with a broken packaging step is a real
  # and common state, and it is the one a user hits first.
  # ---------------------------------------------------------------------------
  assemble:
    name: Assemble debug APK (no native bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert the APK exists and is not empty
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "built $apk ($size bytes)"
          if [ "$size" -lt 100000 ]; then
            echo "::error::APK is implausibly small ($size bytes) — packaging probably failed silently"
            exit 1
          fi

      - name: The public build carries no pre-filled target
        run: |
          set -euo pipefail
          # The promise in README/PROVISIONING is that this build ships with no
          # address of anybody's. Asserting it against the *generated* BuildConfig
          # rather than against the Gradle source is deliberate: it is the value the
          # compiler actually saw, so it cannot be satisfied by the property merely
          # appearing to be absent in one file.
          cfg=$(find app/build/generated/source/buildConfig -name BuildConfig.java | head -n1)
          if [ -z "$cfg" ]; then
            echo "::error::no generated BuildConfig.java found"
            exit 1
          fi
          for field in DEFAULT_TARGET DEFAULT_MODE DEFAULT_UPDATE_URL DEFAULT_PROVISIONING_URL; do
            if ! grep -qE "$field = \"\";" "$cfg"; then
              echo "::error::$field is not empty in the default build:"
              grep -E "$field =" "$cfg"
              echo "::error::The public build must ship with no pre-filled target. Pass it per-build (-PdefaultTarget=…) instead."
              exit 1
            fi
          done
          echo "ok: the default build pre-fills nothing"

      # Not uploaded. A public repository's Actions artifacts are downloadable by
      # anyone, and an APK — even a debug one with no native bridge — is a binary
      # handed out with no release record and no checksum. The assertion above is
      # what this job exists to prove.

  smoke-on-device:
    name: Smoke on an emulator (install, launch, stay up)
    # The one thing no other job does: run the APK on a device. Everything else
    # checks the code, and until this job existed the README's "nothing has run on a
    # device in CI" was true for every release. What it proves is narrow and stated
    # plainly: the shell installs, launches, and stays up, and its window renders.
    # The node-up and dial-failure paths need the bridged build (the AAR from the
    # Tailnet bridge workflow), which is the next step rather than this one.
    #
    # Not run on pull requests on purpose: emulator minutes are the scarce resource
    # here, and main is what ships. Dependency bumps still get compile, lint, test
    # and the guardrails on their PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK (no native bridge)
        run: ./gradlew --no-daemon assembleDebug

      - name: Install it on a clean emulator, launch it, and watch it live
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # `sh`, not bash: the runner hands this script to /usr/bin/sh, where
            # `set -o pipefail` is an illegal option and kills the step with exit 2
            # before the emulator is even touched.
            set -eu
            apk=app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb install -r "$apk"
            adb shell am start -W -n io.github.zero6689.tailnetbyok/.MainActivity
            sleep 10

            pid=$(adb shell pidof io.github.zero6689.tailnetbyok | tr -d '\r' || true)
            if [ -z "$pid" ]; then
              echo "::error::the app is not running ten seconds after launch"
              adb logcat -d | tail -100
              exit 1
            fi
            echo "ok: the app is alive as pid $pid"

            if adb logcat -d -b crash | grep -q 'FATAL EXCEPTION'; then
              echo "::error::the app crashed on launch"
              adb logcat -d -b crash | tail -60
              exit 1
            fi
            echo "ok: nothing in the crash buffer"

            # A live process is not the same as a rendered window: an app stuck on a
            # blank screen would pass the two checks above. This asserts the activity
            # actually owns the screen. `mCurrentFocus` is the API-30 field name and
            # `mFocusedApp` is the fallback, because a rename here must not read as a
            # product failure.
            focused=$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true)
            echo "$focused"
            if ! echo "$focused" | grep -q 'io.github.zero6689.tailnetbyok'; then
              echo "::error::this package does not own the focused window; the UI never rendered"
              exit 1
            fi
            echo "ok: a window from this package is focused"
