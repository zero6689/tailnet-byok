name: Docs site

# Publishes the documentation site to GitHub Pages on every push to main.
#
# The site is hand-written static HTML in `site/`. There is no framework and no
# package install: the "build" is `site/build.mjs`, a dependency-free Node
# script that validates internal links, checks that every page declares the
# shared stylesheet, and stamps the build. That means a docs deploy cannot fail
# because an npm registry was slow, which for a page whose whole job is to
# explain how to reach your own infrastructure is the right trade.
#
# The reasoning behind not using a generator is recorded in site/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  # A published release must redeploy the site even when no file under `site/`
  # changed, because this workflow is what puts the APK mirror on the site. Without
  # this trigger the mirror would keep serving the previous release's bytes, which
  # is the one way a download mirror can be actively harmful.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys are not cancellable mid-flight in a useful way, and two
# concurrent deploys can leave the site on an older revision than main. Queue
# instead of cancelling.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate the site
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `provisioning.html` names the release its download buttons serve. That is
          # the newest *published* release, which is not necessarily this checkout --
          # so it is read here rather than taken from `versionName`, which is how that
          # page came to tell readers the mirror was a version behind.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "latest published release: ${tag:-none}"
          APK_VERSION="${tag#v}" node site/build.mjs

      - name: Verify the build produced the expected pages
        run: |
          set -euo pipefail
          # `site/*.html` are templates; `site/dist/` is what gets published.
          # Asserting on the output rather than the source is the difference
          # between checking that the templates exist and checking that a site
          # was actually rendered from them.
          for page in index.html guide.html security.html architecture.html; do
            if [ ! -s "site/dist/$page" ]; then
              echo "::error::site/dist/$page is missing or empty after the build"
              exit 1
            fi
          done

          # A template token that survived stamping would be served to the
          # public. The build already fails on this; this is the belt to that
          # suspenders, and it runs against the real output directory.
          if grep -rqE '\{\{[A-Z_]+\}\}' site/dist/; then
            echo "::error::an unsubstituted {{TOKEN}} reached the built site"
            grep -rnoE '\{\{[A-Z_]+\}\}' site/dist/ | head -20
            exit 1
          fi

          echo "ok: $(find site/dist -name '*.html' | wc -l) pages, $(du -sh site/dist | cut -f1) total"

      # The download mirror.
      #
      # The release asset and this site are served by *different* hosts: the asset by
      # `release-assets.githubusercontent.com` (Azure Blob), the site by GitHub Pages
      # (Fastly). On some networks the first is unusable while the second is fine --
      # that is the reported symptom this exists for: the provisioning page loads on
      # the phone, the 45 MB APK behind it crawls. So the newest release asset is
      # copied into the published site and `provisioning.html` offers it as a second
      # host for the same bytes.
      #
      # Measured 2026-09-25 on the maintainer's machine, nothing else in flight,
      # 4 MB ranges x3: mirror 2.6 / 13.3 / 14.0 MB/s against the release asset's
      # 2.9 / 7.7 / 7.7. An earlier 0.03 MB/s reading was taken while a 134 MB Gradle
      # download saturated the same link, so it is not a baseline and is not quoted
      # as one anywhere. The mirror is an alternative host, not a proven speedup:
      # which one is faster depends on the network.
      #
      # What is checked rather than assumed: the deployed file was downloaded whole
      # and its sha256 compared against the release digest (2026-09-25: 45,921,396 B,
      # 70d7cd1d...6706f, identical), and that checksum is published beside it so a
      # copy from anywhere can be verified.
      #
      # A repository with no published release yet is a legitimate state (a fork),
      # so a missing release warns rather than failing the docs deploy.
      - name: Publish the release APK as a download mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/dist/byok
          if ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::no published release — the mirror link will 404 until one exists"
            exit 0
          fi
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'tailnet-byok-arm64.apk' \
            --dir site/dist/byok \
            --clobber
          (
            cd site/dist/byok
            sha256sum tailnet-byok-arm64.apk > tailnet-byok-arm64.apk.sha256
          )
          size=$(stat -c%s site/dist/byok/tailnet-byok-arm64.apk)
          echo "mirror: $size bytes, $(cat site/dist/byok/tailnet-byok-arm64.apk.sha256)"
          # A stub or a truncated transfer would be served as a broken installer.
          # A release build is ~35 MB (43.8 MB up to 0.3.9, before the native library
          # was stripped); anything near zero is not one.
          if [ "$size" -lt 10000000 ]; then
            echo "::error::the mirrored APK is implausibly small ($size bytes) — refusing to publish it"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
