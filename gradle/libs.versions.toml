[versions]
# --- Build toolchain -------------------------------------------------------
# AGP 9.4.x is the first line that fully supports compileSdk 37: its sdklib
# reports HIGHEST_KNOWN_STABLE_API = 37, where AGP 8.13 still stops at 36 and
# AGP 9.0/9.1 stop at 36 as well. AGP 9.4 also asks for Gradle 9.6.0 and
# build-tools 36.0.0 at minimum, and it is the version androidx.core 1.19.0
# names as its floor (`minAndroidGradlePluginVersion=9.1.0`).
agp = "9.4.1"
# AGP 9 compiles Kotlin itself (built-in Kotlin) and carries Kotlin Gradle
# plugin 2.2.10 as a runtime dependency, so this is the tested pairing. The
# `org.jetbrains.kotlin.android` plugin is deliberately NOT applied any more:
# AGP 9's new DSL is incompatible with it (`android.newDsl=true` by default).
# The Compose and serialization compiler plugins are still applied, because
# built-in Kotlin does not replace them.
kotlin = "2.2.10"

# --- SDK levels ------------------------------------------------------------
# 37 = Play-compliant in 2026, and the floor androidx.core 1.19.0 declares in
# its AAR metadata (`minCompileSdk=37`, `minCompileMinorSdk=0`). API 37 ships as
# a *minor* platform release, so Google's package path is `platforms;android-37.0`
# and the SDK directory is `android-37.0` — there is no plain `android-37`.
# Override for older local SDKs:
#   ./gradlew assembleDebug -PcompileSdk=35 -PtargetSdk=35
compileSdk = "37"
targetSdk = "37"
minSdk = "26"
# Pinned rather than left to the AGP default. AGP 9.4's own default is still
# build-tools 36.0.0, which is a version nothing in this project asks for and
# which a machine provisioned by scripts/fetch-toolchain.mjs therefore does not
# have. Pinning keeps the build and the toolchain script agreeing.
buildTools = "37.0.0"

# --- AndroidX --------------------------------------------------------------
coreKtx = "1.19.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"

# --- Kotlin libraries ------------------------------------------------------
coroutines = "1.9.0"
serialization = "1.7.3"

# --- Third party -----------------------------------------------------------
okhttp = "4.12.0"

# The QR codec, both directions, in one artifact: `core` is pure Java with no
# Android or AWT dependency when only `qrcode.encoder` / `RGBLuminanceSource` are
# used, which is what keeps the whole decision table unit-testable on the JVM.
# 3.5.3 is the last release of the 3.5 line and is a stable, widely vendored
# revision rather than a moving target.
zxing = "3.5.3"

# The camera. CameraX rather than the deprecated `android.hardware.Camera`: it
# owns the lifecycle, the preview rotation and the frame pipeline, which is the
# part of a scanner that is easy to get subtly wrong on one device.
camerax = "1.4.1"

# --- Test ------------------------------------------------------------------
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
# Robolectric runs the JVM tests against a real Android framework jar, so its
# ceiling is the highest `android-all` it knows. 4.14.x stops at API 35, and the
# tests take the SDK from the manifest — which is 37 now. 4.17 is the release
# that carries `android-all:17-robolectric-…`.
robolectric = "4.17"
mockk = "1.13.13"
turbine = "1.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
