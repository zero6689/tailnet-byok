# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# File-system watching is off by default here.
#
# Reasons: in containers, CI sandboxes and some hardened developer machines the
# native file-watcher cannot start (`Couldn't open current thread, error = 5`),
# and although Gradle recovers, it recovers loudly — a stack trace on every build
# for something that is not actually a build problem. Turning it off makes the
# failure impossible and costs only incremental-build speed on repeat builds.
# Set to true locally if you want it back.
org.gradle.vfs.watch=false

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# BuildConfig generation is enabled per module in app/build.gradle.kts
# (`buildFeatures { buildConfig = true }`). AGP 8 warns that the global
# `android.defaults.buildfeatures.buildconfig` switch is deprecated and goes away
# in AGP 9, so it is deliberately not set here.

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Project switches (never put secrets in this file — it is committed)
# ---------------------------------------------------------------------------
# withTsnet=true  -> compile the native tsnet bridge (requires app/libs/tailnet.aar)
# withTsnet=false -> ship the skeleton without the embedded tailnet node;
#                    the app then only orchestrates configuration + testing.
withTsnet=false
